<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HYROX Bengaluru 2027 Training Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mut:#6b6a64;--line:#e3e1d8;--acc:#e8590c;--ok:#2f9e44;--p0:#1c7ed6;--p1:#e8590c;--p2:#c2255c;--p3:#2f9e44;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--ink:#f0eee6;--mut:#a09f96;--line:#38372f;--acc:#ff8a4c;--ok:#51cf66;--p0:#4dabf7;--p1:#ff8a4c;--p2:#f06595;--p3:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--ink:#f0eee6;--mut:#a09f96;--line:#38372f;--acc:#ff8a4c;--ok:#51cf66;--p0:#4dabf7;--p1:#ff8a4c;--p2:#f06595;--p3:#69db7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mut);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip.full{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.now{outline:2px solid var(--acc)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.nav .mid{flex:1;text-align:center}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}
.box{flex:none;width:24px;height:24px;border:2px solid var(--mut);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin-top:1px}
.task.on .box{background:var(--ok);border-color:var(--ok)}
.task.on .txt{color:var(--mut);text-decoration:line-through}
.task.today{background:color-mix(in srgb,var(--acc) 9%,transparent);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.txt{font-size:15px}
input.log{width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>HYROX Bengaluru 2027 Tracker</h1>
  <p class="sub">Race: 12–16 May 2027 · BIEC · 24-week plan from 23 Nov 2026</p>
  <div class="stats">
    <div class="stat"><b id="sDays">–</b><span>days to race</span></div>
    <div class="stat"><b id="sAll">0%</b><span>plan complete</span></div>
    <div class="stat"><b id="sWk">0%</b><span>this week</span></div>
  </div>
  <div class="card"><div class="row"><span class="mut">Overall progress</span><span class="mut" id="sCnt"></span></div><div class="bar" style="margin-top:8px"><i id="sBar" style="width:0"></i></div></div>
  <div class="tabs"><button id="tM">By month</button><button id="tW">By week</button></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const START=new Date(2026,10,23),RACE=new Date(2027,4,12),NW=24;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const PH=[['Base','--p0'],['Build','--p1'],['Race-specific','--p2'],['Taper','--p3']];
const BENCH=[4,8,12,16,20];
const HAB='Habits: 7+ h sleep on 5 nights, protein and hydration on target, 3 mobility sessions';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fmt=d=>MN[d.getMonth()]+' '+d.getDate();
const phase=w=>w<=8?0:w<=16?1:w<=22?2:3;
const wkStart=w=>addD(START,7*(w-1));

function plan(w){
  const p=phase(w),i=w-(p==1?8:16);
  let f,m,t,wd,th,fr,s,su;
  if(p==0){
    f='Build the aerobic base, learn station technique, load strength';
    m='Lower strength: squat, RDL, split squat 3 × 8–10, plus core';
    t='Run intervals: '+(4+Math.ceil(w/2))+' × 800 m at 5K pace, 90 s jog rest';
    wd='Upper/pull strength + SkiErg 5 × 500 m (technique focus)';
    th='Easy run '+(30+2*w)+' min, then 10 min mobility';
    fr='Light stations: sled push/pull 6 × 25 m, farmers carry 4 × 50 m, wall balls 5 × 15, burpee broad jumps 4 × 20 m';
    s='Easy combo: '+(2+Math.ceil(w/3))+' × (1 km easy run + 1 station at light weight)';
    su='Long easy run '+(50+5*w)+' min (Zone 2), or full rest';
  }else if(p==1){
    f='Threshold running, heavier strength, station volume';
    m='Heavier lower strength: squat, deadlift, lunges 4 × 5–6, plus core';
    t=(3+Math.ceil(i/3))+' × 1 km at threshold pace, 60 s rest';
    wd='Upper/pull strength + SkiErg 4 × 750 m + row 4 × 500 m, steady pace';
    th='Easy run 45 min, then mobility';
    fr='Sled push/pull at '+(i<4?'moderate':'near-race')+' weight 5 × 25 m, farmers carry 4 × 50 m, wall balls 5 × 20, burpee broad jumps 4 × 40 m';
    s=(3+Math.floor(i/2))+' × (1 km run + station at race weight), rotate the station each week';
    su='Long easy run '+(75+2*i)+' min';
  }else if(p==2){
    f=['Compromised running begins','Half simulation week','Build race fitness','Full simulation week','Peak volume','Sharpen and hold fitness'][i-1];
    m='Strength maintenance: squat/deadlift 3 × 5, plus 100 m sandbag lunges';
    t='6 × 1 km at goal race pace, 60 s rest';
    wd='SkiErg 1 km + row 1 km at race effort, then pull-ups or rows 3 × 8';
    th='Easy run 40 min, then mobility';
    fr='Race-weight stations: sled push + pull, 200 m farmers carry, 100 wall balls in sets of 20, 80 m burpee broad jumps';
    s=['6 × (1 km + station) at race weight','HALF SIMULATION: 4 runs + 4 stations at race pace','7 × (1 km + station) at race weight','FULL SIMULATION: 8 × 1 km + 8 stations, as close to race day as possible (practise fueling)','8 × (1 km + station), steady effort','4 × (1 km + station) at race pace, finish fresh'][i-1];
    su='Easy run 60 min';
  }else if(w==23){
    f='Taper: cut volume about 40%, keep some intensity';
    m='Light strength: squat/deadlift 2 × 5, nothing near failure';
    t='4 × 1 km at race pace, full recovery';
    wd='SkiErg + row 3 × 500 m at race effort, easy upper work';
    th='Easy run 30 min, then mobility';
    fr='Short race-weight stations: sled 3 × 25 m, wall balls 3 × 20, carries 2 × 50 m';
    s='4 × (1 km + station) at race pace, stay fresh';
    su='Easy run 45 min, or rest';
  }else{
    f='Race week: freshen up (May 10–11: rest, light walk, kit and travel prep)';
    m='Light full-body 30 min and mobility';
    t='3 × 1 km at race pace + 4 strides';
    wd='Mobility, write your pacing, hydration and fueling plan, pack kit bag';
    th='20 min shakeout run + 3 strides';
    fr='Rest, or a 20 min walk';
    s='Easy 15 min jog + 5 min light station technique';
    su='Rest and sleep. Race is 12–16 May: check your wave time and bring ID';
  }
  if(BENCH.includes(w)) th='BENCHMARK: 5K time trial (log your time below)';
  return {focus:f,tasks:[m,t,wd,th,fr,s,su,HAB]};
}

let S={done:{},logs:{}},ref=null,loaded=false,tab='weeks',cur=1,timer=null;
const key=(w,k)=>'w'+w+'t'+k;
function wkDone(w){let n=0;for(let k=0;k<8;k++)if(S.done[key(w,k)])n++;return n}
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function nowWeek(){const d=Math.floor((today0()-START)/864e5);return Math.min(NW,Math.max(1,Math.floor(d/7)+1))}

function setStats(){
  let all=0;for(let w=1;w<=NW;w++)all+=wkDone(w);
  const tot=NW*8,pa=Math.round(all/tot*100),pw=Math.round(wkDone(nowWeek())/8*100);
  const dl=Math.ceil((RACE-today0())/864e5);
  document.getElementById('sDays').textContent=dl>0?dl:(dl==0?'Today':'Done');
  document.getElementById('sAll').textContent=pa+'%';
  document.getElementById('sWk').textContent=pw+'%';
  document.getElementById('sCnt').textContent=all+' / '+tot+' done';
  document.getElementById('sBar').style.width=pa+'%';
}
function monthsView(){
  const g={};
  for(let w=1;w<=NW;w++){const d=wkStart(w),k=d.getFullYear()*12+d.getMonth();(g[k]=g[k]||{d,ws:[]}).ws.push(w)}
  let h='';
  Object.keys(g).sort((a,b)=>a-b).forEach(k=>{
    const {d,ws}=g[k];let dn=0;ws.forEach(w=>dn+=wkDone(w));
    const pc=Math.round(dn/(ws.length*8)*100);
    const ps=[...new Set(ws.map(phase))].map(p=>'<span class="tag" style="background:var('+PH[p][1]+')">'+PH[p][0]+'</span>').join(' ');
    h+='<div class="card"><div class="row"><b>'+MF[d.getMonth()]+' '+d.getFullYear()+'</b><span class="mut">'+pc+'%</span></div>'
      +'<div style="margin:6px 0">'+ps+'</div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="chips">'
      +ws.map(w=>'<button class="chip'+(wkDone(w)==8?' full':'')+(w==nowWeek()?' now':'')+'" data-w="'+w+'">Wk '+w+' · '+fmt(wkStart(w))+' · '+wkDone(w)+'/8</button>').join('')+'</div></div>';
  });
  return h+'<div class="card"><b>Race: 12–16 May 2027</b><div class="mut">Bangalore International Exhibition Centre. Confirm your wave time and division on the official HYROX page.</div></div>';
}
function weekView(){
  const w=cur,p=phase(w),P=plan(w),st=wkStart(w),td=today0();
  let h='<div class="nav"><button data-n="-1" '+(w==1?'disabled':'')+'>←</button><div class="mid"><b>Week '+w+' of '+NW+'</b><div class="mut">'+fmt(st)+' – '+fmt(addD(st,6))+'</div></div><button data-n="1" '+(w==NW?'disabled':'')+'>→</button></div>';
  h+='<div class="card"><span class="tag" style="background:var('+PH[p][1]+')">'+PH[p][0]+'</span> <span class="mut">'+esc(P.focus)+'</span><div class="bar" style="margin-top:10px"><i style="width:'+(wkDone(w)/8*100)+'%"></i></div></div><div class="card">';
  P.tasks.forEach((t,k)=>{
    const d=k<7?addD(st,k):null,isT=d&&d.getTime()==td.getTime();
    h+='<div class="task'+(S.done[key(w,k)]?' on':'')+(isT?' today':'')+'" data-t="'+k+'"><div class="box">'+(S.done[key(w,k)]?'✓':'')+'</div><div style="flex:1"><div class="day">'+(k<7?DN[k]+' · '+fmt(d)+(isT?' · today':''):'Weekly')+'</div><div class="txt">'+esc(t)+'</div>'
      +(k==3&&BENCH.includes(w)?'<input class="log" data-log="'+w+'" placeholder="5K time, e.g. 26:40" value="'+esc(S.logs['b'+w]||'')+'">':'')+'</div></div>';
  });
  return h+'</div>';
}
function render(){
  document.getElementById('tM').className=tab=='months'?'on':'';
  document.getElementById('tW').className=tab=='weeks'?'on':'';
  document.getElementById('view').innerHTML=tab=='months'?monthsView():weekView();
  setStats();
}
function save(){
  try{localStorage.setItem('hyrox-blr-27',JSON.stringify(S))}catch(e){}
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    if(ref&&loaded){try{await ref.set({done:S.done,logs:S.logs});foot('Saved')}catch(e){foot('Could not sync, saved on this device only')}}
  },500);
}
function foot(t){document.getElementById('foot').textContent=t}
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tM,#tW');if(tb){tab=tb.id=='tM'?'months':'weeks';render();return}
  const c=e.target.closest('[data-w]');if(c){cur=+c.dataset.w;tab='weeks';render();scrollTo(0,0);return}
  const n=e.target.closest('[data-n]');if(n&&!n.disabled){cur=Math.min(NW,Math.max(1,cur+ +n.dataset.n));render();return}
  if(e.target.closest('input'))return;
  const t=e.target.closest('[data-t]');if(t){const k=key(cur,+t.dataset.t);if(S.done[k])delete S.done[k];else S.done[k]=1;save();render()}
});
document.addEventListener('input',e=>{const l=e.target.dataset&&e.target.dataset.log;if(l){S.logs['b'+l]=e.target.value;save();setStats()}});

(async function init(){
  cur=nowWeek();
  try{const l=JSON.parse(localStorage.getItem('hyrox-blr-27')||'null');if(l&&l.done)S=l}catch(e){}
  render();
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const r=db.collection('data/users/'+id).doc('progress');
    const snap=await Promise.race([r.get(),new Promise(res=>setTimeout(()=>res(null),10000))]);
    if(!snap)return foot('Cloud sync unavailable, saving on this device');
    if(snap.exists){const d=snap.data()||{};S={done:Object.assign({},d.done||{}),logs:Object.assign({},d.logs||{})}}
    ref=r;loaded=true;
    if(!snap.exists)r.set({done:S.done,logs:S.logs}).catch(()=>{});
    render();foot('Progress syncs to your account');
  }catch(e){foot('Saving on this device')}
})();
</script>
</body>
</html>
